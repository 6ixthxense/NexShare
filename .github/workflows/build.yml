name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach APKs to releases on version tags

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Unit & integration tests (HTTP server, crypto, TLS, resumable upload, quota, audit, file request)
        run: ./test/run-tests.sh
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax-check web UI
        run: for f in app/assets/web/js/*.js app/assets/web/sw.js; do node --check "$f"; done

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Browser smoke tests (headless Chromium + WebKit + mock backend)
        env:
          CI: 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q playwright
          python -m playwright install --with-deps chromium webkit
          python test/ui/ui_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: build/ui/*.png

  apk:
    needs: [test, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: cmdline-tools 16+ no longer has a "tools" package.
          packages: 'platform-tools'
      - name: Fetch SDK packages and libraries
        run: ./setup.sh
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NEXSHARE_KEYSTORE_B64 }}
        run: |
          # Release builds must be signed with the same key as earlier releases so phones can update.
          # Store it as base64 in the NEXSHARE_KEYSTORE_B64 / NEXSHARE_KEYSTORE_PASS secrets.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "NEXSHARE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No NEXSHARE_KEYSTORE_B64 secret — building with a throwaway key (fine for testing, not for releases)."
          fi
      - name: Build both editions
        env:
          NEXSHARE_KEYSTORE_PASS: ${{ secrets.NEXSHARE_KEYSTORE_PASS }}
        run: ./build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: NexShare-apks
          path: dist/*.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

  emulator:
    needs: [apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with:
          name: NexShare-apks
          path: dist
      - name: Enable KVM and patch sdkmanager for legacy 'tools' package
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for sm in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$sm" ] && [ ! -f "$sm.real" ]; then
              sudo mv "$sm" "$sm.real"
              sudo tee "$sm" >/dev/null <<'EOS'
          #!/usr/bin/env bash
          args=()
          for a in "$@"; do
            [ "$a" = "tools" ] && continue
            args+=("$a")
          done
          [ "${#args[@]}" -eq 0 ] && exit 0
          exec "$0.real" "${args[@]}"
          EOS
              sudo chmod +x "$sm"
            fi
          done
      - name: Run APK on Android Emulator and test HTTP + HTTPS APIs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            adb wait-for-device
            APK=$(ls dist/NexShare-v*.apk | grep -v root | head -n 1)
            echo "Installing $APK ..."
            if ! adb install -r -g "$APK"; then
              echo "Repackaging APK without ARM-only native libs for x86_64 emulator..."
              cp "$APK" /tmp/emu-unaligned.apk
              zip -d /tmp/emu-unaligned.apk 'lib/*' || true
              BT=$(ls -d "$ANDROID_HOME/build-tools/"* | tail -n 1)
              "$BT/zipalign" -p -f 4 /tmp/emu-unaligned.apk /tmp/emu-aligned.apk
              keytool -genkeypair -keystore /tmp/emu.keystore -alias emu -keyalg RSA -keysize 2048 -validity 10 -storepass android -keypass android -dname CN=NexShare
              "$BT/apksigner" sign --ks /tmp/emu.keystore --ks-pass pass:android --out /tmp/emu.apk /tmp/emu-aligned.apk
              adb install -r -g /tmp/emu.apk
            fi
            adb shell appops set com.nexshare MANAGE_EXTERNAL_STORAGE allow || true
            adb shell am start -n com.nexshare/.MainActivity
            sleep 2
            adb shell am start-foreground-service -n com.nexshare/.ServerService || adb shell am startservice -n com.nexshare/.ServerService || true
            adb forward tcp:8080 tcp:8080
            adb forward tcp:8443 tcp:8443
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/api/session > /tmp/session.json; then
                break
              fi
              sleep 1
            done
            cat /tmp/session.json
            grep -q '"pinRequired":true' /tmp/session.json
            for i in $(seq 1 30); do
              if curl -skf https://127.0.0.1:8443/api/session > /tmp/https_session.json; then
                break
              fi
              sleep 1
            done
            echo "Testing plain HTTP -> HTTPS port 8443 redirect..."
            REDIRECT=$(curl -sI http://127.0.0.1:8443/ | tr -d '\r')
            echo "$REDIRECT"
            echo "$REDIRECT" | grep -qi "301 Moved Permanently"
            echo "$REDIRECT" | grep -qi "Location: https://127.0.0.1:8443/"
            echo "Testing HTTPS on port 8443..."
            cat /tmp/https_session.json
            grep -q '"secure":true' /tmp/https_session.json
            echo "Android Emulator end-to-end HTTP + HTTPS checks passed!"
